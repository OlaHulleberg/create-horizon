[package]
name = "create"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Create for Horizon: the native mod (game glue on the mod API)"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
# Create's rules as plain Rust with no game types.
create-engine = { path = "src/engine" }
