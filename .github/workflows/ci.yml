name: Native mod
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The pinned fork build
        id: pin
        run: echo "horizon=$(python3 -c 'import tomllib; print(tomllib.load(open("create/horizon-mod.toml", "rb"))["native"]["horizon"])')" >> "$GITHUB_OUTPUT"
      - name: Install the SDK's Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.1
      - name: Install cargo horizon-mod at the pinned build
        run: cargo install --locked --git https://github.com/sunrise-org/sunrise --rev "${{ steps.pin.outputs.horizon }}" cargo-horizon-mod
      - name: Package rules, SDK fetch and cargo check
        working-directory: create
        run: cargo horizon-mod check
      - working-directory: create
        run: cargo fmt --all --check
      - working-directory: create
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: create
        run: cargo test
      - working-directory: create
        run: cargo test -p create-engine
  create-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy && rustup default 1.99.1
      - working-directory: tools/create-data
        run: cargo fmt --check
      - working-directory: tools/create-data
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: tools/create-data
        run: cargo test --locked
