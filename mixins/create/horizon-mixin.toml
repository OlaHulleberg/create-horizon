[mod]
id = "create"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1e573d55a332cc0663c7d80332bdce37f9cc514a"

# Game glue: per-world state on the server thread, translating hooks into engine calls.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "create"
source = "runtime.rs"

# Pure logic and the tables create-data compiles from Create's MIT data.
[[crate]]
id = "engine"
path = "engine"

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "&crate::game::native_lifecycle::WorldPhase", value = "&phase" },
]

[[injection]]
id = "block-changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "block_changed.rs"
bindings = [
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "old", ty = "horizon_world::registry::BlockStateId", value = "old" },
  { name = "new", ty = "horizon_world::registry::BlockStateId", value = "new" },
]

[[injection]]
id = "chunk-load"
hook = "chunk_load"
hook_version = 1
kind = "HEAD"
helper = "chunks.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "&horizon_client::chunk::Chunk", value = "chunk" },
]

[[injection]]
id = "chunk-unload"
hook = "chunk_unload"
hook_version = 1
kind = "HEAD"
helper = "chunk_unload.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "&horizon_client::chunk::Chunk", value = "chunk" },
]

[[injection]]
id = "level-tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]

[[injection]]
id = "net-from-client"
hook = "net_from_client"
hook_version = 1
kind = "HEAD"
helper = "net.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "net-from-server"
hook = "net_from_server"
hook_version = 1
kind = "HEAD"
helper = "net_client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "wheel"
hook = "wheel"
hook_version = 1
kind = "HEAD"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

[[injection]]
id = "chunk-data-save"
hook = "chunk_data_save"
hook_version = 1
kind = "HEAD"
helper = "chunk_save.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "[i32; 2]", value = "chunk" },
  { name = "data", ty = "&mut horizon_world::nbt::Compound", value = "data" },
]

[[injection]]
id = "neighbor-changed"
hook = "neighbor_changed"
hook_version = 1
kind = "HEAD"
helper = "neighbor.rs"
bindings = [
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]

[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]
