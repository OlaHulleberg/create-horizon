[mod]
id = "create"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "2fb4499e9a8cae83adb8e3cdd63c6d81cdf80947"

# Game glue: per-world state on the server thread, translating hooks into engine calls.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "create"
source = "runtime.rs"

# Pure logic and the tables create-data compiles from Create's MIT data.
[[crate]]
id = "engine"
path = "engine"

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "&crate::game::native_lifecycle::WorldPhase", value = "&phase" },
]

[[injection]]
id = "block-changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "block_changed.rs"
bindings = [
  { name = "dimension", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "old", ty = "horizon_world::registry::BlockStateId", value = "old" },
  { name = "new", ty = "horizon_world::registry::BlockStateId", value = "new" },
]

[[injection]]
id = "chunk-load"
hook = "chunk_load"
hook_version = 1
kind = "HEAD"
helper = "chunks.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "chunk", ty = "&horizon_client::chunk::Chunk", value = "chunk" },
]

