plugins {
    id("net.neoforged.moddev") version "2.0.141"
}

if (System.getenv("FUZZ_JAVA_BUILD") != null) {
    layout.buildDirectory = file(System.getenv("FUZZ_JAVA_BUILD"))
}

group = "dev.createfuzz"
version = "0.1.0"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal() // Create 6.0.11, from `./gradlew publishToMavenLocal` in a Create checkout
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
}

neoForge {
    version = "21.1.219" // Create 6.0.11's neo_version
    runs {
        server {
            server()
            jvmArgument("-XX:-EnableDynamicAgentLoading")
            gameDirectory = project.file(System.getenv("FUZZ_GAME_DIR") ?: "run")
            programArgument("--nogui")
            // JaCoCo, when FUZZ_JACOCO names its agent jar (see ../run.sh).
            if (System.getenv("FUZZ_JACOCO") != null) {
                jvmArgument("-javaagent:" + System.getenv("FUZZ_JACOCO"))
            }
        }
    }
    mods {
        createfuzz { sourceSet(sourceSets.main) }
    }
}

dependencies {
    implementation("com.simibubi.create:create-1.21.1:6.0.11")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
    implementation("net.createmod.ponder:ponder-neoforge:1.0.92+mc1.21.1") { version { strictly("1.0.92+mc1.21.1") } }
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.7") { version { strictly("1.0.7") } }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.7")
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
