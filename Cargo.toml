[package]
name = "create"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Create for Horizon: the native mod (game glue on the mod API)"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Create's rules as plain Rust with no game types.
create-engine = { path = "src/engine" }
# Recipe files as the game gives them (`Recipe::json`).
serde_json = "1"
